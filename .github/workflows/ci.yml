name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/speech-queue.js
          node --check src/kokoro-worker-client.js
          node --check src/voice-catalog.js
          node --check src/voice-preferences.js
          node --check scripts/deploy-commands.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/renderer/renderer.js
      - name: Check Python syntax
        run: python -m py_compile src/kokoro_worker.py
      - name: Audit Node dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report = require('./npm-audit.json'); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ': ' + item.severity + '; fixAvailable=' + JSON.stringify(item.fixAvailable))"
      - name: Run tests
        run: npm test
