name: GafiPresence Windows build

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "GafiPresence/**"
      - ".github/workflows/gafipresence-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GafiPresence
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript syntax
        run: |
          node --check main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check renderer/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable application
        run: npm run build:win
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: GafiPresence-Windows-Portable
          path: GafiPresence/dist/GafiPresence-0.1.0-Portable.exe
          if-no-files-found: error
