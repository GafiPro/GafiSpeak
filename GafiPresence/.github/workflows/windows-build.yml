name: Windows portable build

on:
  push:
    paths:
      - "GafiPresence/**"
      - ".github/workflows/gafipresence-windows.yml"
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GafiPresence
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GafiPresence/package.json
      - name: Install dependencies
        run: npm install
      - name: Build portable application
        run: npm run build:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GafiPresence-Windows-Portable
          path: GafiPresence/dist/GafiPresence-0.1.0-Portable.exe
          if-no-files-found: error
